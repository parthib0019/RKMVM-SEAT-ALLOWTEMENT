<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SARA | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: rgb(0, 0, 0);
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-container {
        text-align: center;
        padding: 40px 30px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        backdrop-filter: blur(4px);
        box-shadow: 0 0 25px rgba(255, 123, 0, 0.3);
        width: 320px;
    }

    .logo {
        width: 120px;
        height: 120px;
        margin-bottom: 10px;
        border-radius: 50%;
        box-shadow: 0 0 25px rgba(255, 123, 0, 0.3);
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 25px;
        letter-spacing: 4px;
        font-weight: 700;
    }

    input[type="password"] {
        width: auto;
        padding: 12px;
        margin-top: 10px;
        margin-bottom: 20px;
        background: #ffffff;
        border: 2px solid #333;
        border-radius: 8px;
        color: rgb(0, 0, 0);
        font-size: 16px;
        outline: none;
        transition: 0.2s;
    }

    input[type="password"]:focus {
        border-color: orange;
        box-shadow: 0 0 10px rgba(255, 123, 0, 0.7);
    }

    button {
        width: 100%;
        padding: 12px;
        background: rgb(0, 0, 0);
        color: rgb(255, 255, 255);
        border: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.2s;
    }

    button:hover {
        background: orange;
        color: black;
        box-shadow: 0 0 12px rgba(255, 123, 0, 0.8);
    }

    .error {
        margin-top: 10px;
        color: rgb(255, 0, 0);
        font-size: 0.9rem;
    }
</style>
</head>
<body>

<div class="login-container">

    <!-- Use your product logo file here -->
    <img src="/static/img/SARA-FAVICON.png" alt="Logo" class="logo">

    <h1>SARA</h1>

    <form action="/LoginBar" method="POST">
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">ENTER</button>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </form>

</div>

</body>
</html>
