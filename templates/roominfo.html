  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.A.S | Room Info</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" />
  <style>
    :root {
      --primary-color: #4a90e2;
      --secondary-color: #64748b;
      --accent-color: #fff;
      --error-color: #dc2626;
      --header-footer-color: rgba(255,255,255,0.18);
      --card-background: rgba(255,255,255,0.85);
      --border-radius: 16px;
      --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
      --transition: all 0.2s cubic-bezier(.4,0,.2,1);
    }
    body {
      font-family: 'Roboto Mono', monospace;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(120deg, #e0e7ef 0%, #f8fafc 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .main-container {
      background: var(--card-background);
      margin-top: 40px;
      padding: 2.5rem 2.5rem 2.5rem 2.5rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 95vw;
      max-width: 700px;
      position: relative;
      z-index: 1;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: var(--primary-color);
      text-align: center;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.7);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(74, 144, 226, 0.08);
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 12px 8px;
      text-align: center;
      font-size: 1rem;
      color: #334155;
    }
    th {
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 700;
    }
    th.edit-col, td.edit-col {
      background: transparent !important;
      border: none !important;
      color: transparent !important;
      min-width: 60px;
      padding: 0 12px 0 16px !important;
      text-align: center;
    }
    .editBtn, .deleteBtn {
      background: var(--secondary-color);
      color: var(--accent-color);
      border: 2px solid var(--primary-color);
      border-radius: var(--border-radius);
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .editBtn:hover {
      background: var(--primary-color);
      color: var(--accent-color);
      box-shadow: 0 0 20px rgba(74, 144, 226, 0.7), 0 0 10px rgba(74, 144, 226, 0.4);
      transform: translateY(-3px);
    }
    .deleteBtn {
      background: var(--error-color);
      border: 2px solid var(--error-color);
    }
    .deleteBtn:hover {
      background: #b91c1c;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.7), 0 0 10px rgba(239, 68, 68, 0.4);
    }
    #addBtn {
      font-size: 1.5rem;
      padding: 0.5rem 1.5rem;
      background: var(--primary-color);
      color: var(--accent-color);
      border: none;
      border-radius: var(--border-radius);
      margin-bottom: 10px;
      transition: var(--transition);
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(74, 144, 226, 0.08);
    }
    #addBtn:hover {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 0 20px rgba(74, 144, 226, 0.3);
      transform: translateY(-2px);
    }
    /* Modal glassmorphism */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.35);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: rgba(255,255,255,0.85);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      width: 340px;
      margin: 10vh auto 0 auto;
      position: relative;
      border: 1.5px solid rgba(74,144,226,0.15);
      font-family: 'Roboto Mono', monospace;
    }
    .modal-content label {
      display: block;
      margin: 10px 0 5px;
      color: #334155;
      font-weight: 700;
    }
    .modal-content input {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-family: 'Roboto Mono', monospace;
      font-size: 1rem;
      background: #f8fafc;
      transition: border 0.2s;
    }
    .modal-content input:focus {
      border: 1.5px solid var(--primary-color);
      outline: none;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 18px;
      font-size: 1.5rem;
      color: #64748b;
      cursor: pointer;
      font-weight: bold;
      z-index: 2;
      transition: color 0.2s;
    }
    .close:hover {
      color: var(--primary-color);
    }
    .modal-content button[type='submit'] {
      background: var(--primary-color);
      color: var(--accent-color);
      border: none;
      border-radius: var(--border-radius);
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      transition: var(--transition);
      margin-top: 0.5rem;
      cursor: pointer;
    }
    .modal-content button[type='submit']:hover {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 0 20px rgba(74, 144, 226, 0.3);
    }
    @media (max-width: 700px) {
      .main-container {
        padding: 1rem;
        max-width: 99vw;
      }
      .modal-content {
        width: 95vw;
        min-width: 0;
      }
      table {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h1>Seat Allotment System<br><span style="font-size:1.1rem;font-weight:400;color:#64748b;">Room Information</span></h1>
    <table id="roomsTable">
      <thead>
        <tr>
          <th>RoomId</th>
          <th>Total Capacity</th>
          <th>BenchPerCol</th>
          <th class="edit-col" style="color:transparent;">Edit</th>
          <th class="edit-col" style="color:transparent;">Delete</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be added dynamically -->
      </tbody>
    </table>
    <div style="display: flex; align-items: center; gap: 1rem; margin-top: 0.5rem;">
      <button id="addBtn">+</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="roomModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Add Room</h3>
      <form id="roomForm">
        <label for="roomName">Room Name</label>
        <input type="text" id="roomName" required>
        
        <label for="capacity">Capacity</label>
        <input type="number" id="capacity" required>
        
  <label for="benches">Benches per Col</label>
  <input type="text" id="benches" pattern="[0-9]+(,[0-9]+)*" title="Enter numbers separated by commas, e.g. 12,12,15" required>
        
        <button type="submit">Add</button>
      </form>
    </div>
  </div>

  <script>
    const modal = document.getElementById("roomModal");
    const addBtn = document.getElementById("addBtn");
    const closeBtn = document.querySelector(".close");
    const form = document.getElementById("roomForm");
    const tableBody = document.getElementById("roomsTable").querySelector("tbody");
  const roomNameInput = document.getElementById("roomName");
  const capacityInput = document.getElementById("capacity");
  const benchesInput = document.getElementById("benches");

    // Store current editing row
    let editingRow = null;

    // Real data for initial table
    const realRooms = [
      { room: "1", capacity: "110", benches: "18,18,19" },
      { room: "13", capacity: "36", benches: "9,9" },
      { room: "15", capacity: "72", benches: "12,12,12" },
      { room: "16", capacity: "54", benches: "9,9,9" },
      { room: "18", capacity: "16", benches: "4,4" },
      { room: "20", capacity: "78", benches: "12,12,15" },
      { room: "3A", capacity: "28", benches: "6,4,4" },
      { room: "Sister Nivedita Hall", capacity: "88", benches: "22,22" },
      { room: "Tejasananda Hall", capacity: "60", benches: "15,15" },
    ];

    function addRow({ room, capacity, benches }) {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${room}</td>
        <td>${capacity}</td>
        <td>${benches}</td>
  <td class="edit-col"><button class="editBtn">Edit</button></td>
  <td class="edit-col"><button class="deleteBtn">Delete</button></td>
      `;
      // Edit event
      row.querySelector(".editBtn").onclick = function(e) {
        e.stopPropagation();
        editingRow = row;
        roomNameInput.value = row.children[0].textContent;
        capacityInput.value = row.children[1].textContent;
        benchesInput.value = row.children[2].textContent;
        modal.style.display = "block";
        form.querySelector("button[type='submit']").textContent = "Save";
        modal.querySelector("h3").textContent = "Edit Room";
      };
      // Delete event
      row.querySelector(".deleteBtn").onclick = function(e) {
        e.stopPropagation();
        row.remove();
      };
      tableBody.appendChild(row);
    }

    // Populate table with real data
    realRooms.forEach(addRow);

    addBtn.onclick = () => {
      editingRow = null;
      form.reset();
      modal.style.display = "block";
      form.querySelector("button[type='submit']").textContent = "Add";
      modal.querySelector("h3").textContent = "Add Room";
    };
    closeBtn.onclick = () => modal.style.display = "none";
    window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }

    form.onsubmit = (e) => {
      e.preventDefault();
      const room = roomNameInput.value;
      const capacity = capacityInput.value;
      const benches = benchesInput.value;
      if (editingRow) {
        editingRow.children[0].textContent = room;
        editingRow.children[1].textContent = capacity;
        editingRow.children[2].textContent = benches;
        editingRow = null;
      } else {
        addRow({ room, capacity, benches });
      }
      form.reset();
      modal.style.display = "none";
    };
  </script>

</body>
</html>
